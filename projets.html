                        <template x-if="openProject === 1">

                                        <div class="popup-text">
                                            <h2>Chef Chatter</h2>
                                            <p>
                                                Chef Chatter était le projet final de ma première année universitaire.
                                                En équipe de cinq,
                                                nous avons développé une application web et mobile permettant aux
                                                utilisateurs de partager
                                                et consulter des recettes. L’application mobile partageait les mêmes
                                                données que la version web,
                                                ce qui nous a amenés à concevoir une base de données SQL connectée à
                                                notre API via plusieurs routes.
                                                Malheureusement, le site n’est plus disponible. Le projet a été réalisé
                                                en PHP, HTML, CSS et JavaScript et
                                                l'application mobile sur Android Studio en Java.
                                                <br>
                                                Les liens ci-dessous mènent aux dépôts GitHub des deux projets.
                                            </p>
                                            <a href="https://github.com/Lsthilaire0189/tch-099-01" class="btn">Projet

                                                class="btn">PowerPoint</a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </template>
                        <template x-if="openProject === 2">

                                <div class="popup-backdrop"></div>

                                        <div class="popup-text">
                                            <h2>Le labyrinthe des ténèbres</h2>
                                            <p>
                                                Ce projet a été réalisé en équipe de trois comme projet final de mes
                                                études collégiales.
                                                Nous devions créer une simulation 3D intégrant des éléments

                                                Nous avons donc développé un jeu vidéo avec génération procédurale,

                                            <a href="https://etsmtl365-my.sharepoint.com/:p:/r/personal/antoine_odonnell_1_ens_etsmtl_ca/Documents/Pr%C3%A9sentation.pptx?d=w9e63f2583d6f4e1b8062e4a0a0cb2fc9&csf=1&web=1&e=gaKc3z&nav=eyJzSWQiOjI1NiwiY0lkIjoxMzMwNjg4MTQ1fQ"

                        <template x-if="openProject === 3">

                                            <h2>Mon premier stage, centre d'essais en vol d'Airbus Canada</h2>
                                            <p>
                                                Mon premier stage à l’ÉTS s’est déroulé chez Airbus Canada, au Centre
                                                d’essais en vol.
                                                J’y ai développé un outil de suivi de la configuration de différents
                                                moyens d’essai,
                                                qu’il s’agisse d’avions ou de simulateurs. Ce stage m’a permis de
                                                collaborer avec les équipes
                                                de maintenance et de définir précisément les besoins de l’application.
                                                J’ai également découvert le monde de l’aéronautique et des simulateurs
                                                de vol,
                                                en échangeant avec les ingénieurs responsables des essais. J’ai
                                                développé plusieurs autres applications

                        <template x-if="openProject === 4">

                                            alt="Popup Image">
                                        <div class="popup-text">
                                            <h2>Développement et maintien de mon mod pour Vintage Story</h2>
                                            <p>
                                                Durant la session d’été 2025, j’ai découvert le jeu indépendant Vintage
                                                Story. Séduit par le potentiel du jeu,
                                                j'ai eu l'idée de développer un mod intitulé “Sliding Wooden Shutters
                                                and More!”.
                                                Ce mod ajoute au jeu des volets coulissants inspirés de modèles
                                                historiques,  destinés aux joueurs qui n’ont pas
                                                encore accès aux fenêtres dans le jeu et qui souhaitent une alternative
                                                réaliste à ce problème.
                                                Toutes les propriétés du bloc sont définies en JSON, ainsi que ses
                                                modèles et sa recette,
                                                tandis que les comportements sont codés en C#.
                                                <br>
                                                Le mod a gagné en popularité dans la communauté, et certains joueurs
                                                m’ont contacté pour signaler des bugs ou
                                                suggérer de nouvelles fonctionnalités.
                                                Je continue donc à le maintenir et à répondre aux attentes des joueurs.
                                                Le premier lien ci-dessous mène à la page du mod sur le site officiel de
                                                Vintage Story et
                                                le second lien mène au dépôt GitHub du mod.
                                            </p>
                                            <a href="https://mods.vintagestory.at/slidingwoodenshutters"
                                                class="btn">Page officiel du mod</a>
                                            <a href="https://github.com/AntoineOD/VintageStoryMod-_-WoodenShutters"
                                                class="btn">Github du mod</a>
                                        </div>
                                    </div>
                                </div>

                         <template x-if="openProject === 5">

                                            <h2>Création d'un petit simulateur de vol sur Unreal Engine</h2>
                                            <p>
                                                J'ai toujours eu une passion pour les simulateurs de vol. Je suis captivé
                                                par la physique et le développement de ces derniers, et les simulateurs que j'ai pu
                                                voir pendant mon stage 1 chez Airbus m'ont épaté par la précision qu'ils peuvent 
                                                atteindre.

                                                J'ai donc décidé de créer mon propre petit simulateur sur Unreal Engine pour
                                                pouvoir, premièrement, me familiariser avec les formules physiques du domaine
                                                qui s’appliquent à un objet, et deuxièmement, commencer à travailler en C++,
                                                un langage qui n'est pas vraiment enseigné dans mon programme à l'école.
                                                J'ai aussi, en parallèle, appris un peu à utiliser le logiciel Blender pour créer mon propre
                                                modèle d'avion.

                                                Le lien ci-dessous mène au répertoire GitHub de mon code source concernant
                                                l'acteur principal, mon avion, et toutes les formules physiques qui s'appliquent à ce
                                                dernier. Un autre lien mène à une vidéo d'une petite démonstration du simulateur
                                                en action.
                                            </p>
                                            <a href="https://github.com/AntoineOD/FlightSimUnreal"
                                                class="btn">Lien vers le GitHub</a>
                                            <a href="https://drive.google.com/file/d/13ihOLN9oR2D07l9uG8_nk83m9Moo2gpm/view?usp=sharing"
                                                class="btn">Lien vers la démonstration</a>
                                        </div>
                                    </div>
                                </div>

                                                    Pendant une fin de semaine, j'ai décidé d'apprendre les bases d'OpenGL.
                                                    J'ai donc suivi un tutoriel en ligne pour pouvoir rapidement apprendre les
                                                    bases de cette API graphique. J'ai appris à créer une fenêtre, à y dessiner des formes
                                                    simples, à appliquer des textures, et à manipuler une caméra. J'ai aussi appris à importer
                                                    des modèles 3D et à manipuler la lumière dans une scène 3D.
                                                    Le lien ci-dessous mène au rapport d'apprentissage que j'ai rédigé après avoir
                                                    complété le tutoriel.
                                            </p>
