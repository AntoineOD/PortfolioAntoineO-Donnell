                                        <h2>Développement et maintien de mon mod pour Vintage Story</h2>
                                        <p>
                                            Durant la session d’été 2025, j’ai découvert le jeu indépendant Vintage Story. Séduit par le potentiel du jeu, 
                                            j'ai eu l'idée de développer un mod intitulé “Sliding Wooden Shutters and More!”. 
                                            Ce mod ajoute au jeu des volets coulissants inspirés de modèles historiques,  destinés aux joueurs qui n’ont pas 
                                            encore accès aux fenêtres dans le jeu et qui souhaitent une alternative réaliste à ce problème. 
                                            Toutes les propriétés du bloc sont définies en JSON, ainsi que ses modèles et sa recette, 
                                            tandis que les comportements sont codés en C#. 
                                            <br>
                                            Le mod a gagné en popularité dans la communauté, et certains joueurs m’ont contacté pour signaler des bugs ou
