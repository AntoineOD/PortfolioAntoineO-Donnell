    <script>
        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.add('light-theme');
        }
        function toggleTheme(e) {
            if (e) e.preventDefault();
            document.documentElement.classList.toggle('light-theme');
            localStorage.setItem('theme', document.documentElement.classList.contains('light-theme') ? 'light' : 'dark');
        }
    </script>

                                        <div class="popup-text">
                                            <h2>Chef Chatter</h2>
                                            <p>
                                                Réalisé en équipe de cinq lors de ma première année universitaire, Chef
                                                Chatter est une plateforme de partage et de consultation de recettes de
                                                cuisine. Le projet se décline en deux volets : une application web et
                                                une application mobile. Pour garantir la synchronisation des données
                                                entre les deux plateformes, nous avons conçu une base de données SQL
                                                robuste, interrogeable via une API REST. Bien que le site ne soit plus
                                                hébergé aujourd'hui, cette expérience m'a permis de consolider mes
                                                compétences en développement full-stack (PHP, HTML, CSS, JavaScript) et
                                                en développement mobile natif (Java sur Android Studio). Les codes
                                                sources restent consultables sur GitHub.
                                            </p>
                                            <a href="https://github.com/Lsthilaire0189/tch-099-01" class="btn">Projet

                                        <div class="popup-text">
                                            <h2>Le labyrinthe des ténèbres</h2>
                                            <p>
                                                Développé en équipe de trois dans le cadre de mon projet de fin d'études
                                                collégiales, « Le labyrinthe des ténèbres » est une simulation 3D

                        <template x-if="openProject === 4">

                                            <h2>Développement et maintien de mon mod pour Vintage Story</h2>
                                            <p>
                                                Fasciné par le potentiel du jeu indépendant Vintage Story, j'ai conçu et
                                                publié le mod « Sliding Wooden Shutters and More ! ». Cette extension
                                                introduit des volets coulissants d'inspiration historique, offrant aux
                                                joueurs une alternative immersive et fonctionnelle avant l'obtention de
                                                fenêtres en verre. Techniquement, l'architecture du mod repose sur des
                                                fichiers JSON pour la définition des modèles, des recettes et des
                                                propriétés des blocs, tandis que la logique et les comportements
                                                interactifs sont programmés en C#. Face à l'engouement de la communauté,
                                                j'assure aujourd'hui le maintien continu du projet, corrigeant les bugs
                                                signalés et intégrant de nouvelles fonctionnalités suggérées par les

                                            <h2>Création d'un simulateur de vol sur Unreal Engine</h2>

                                                Passionné par l'aéronautique et impressionné par le réalisme des
                                                simulateurs professionnels découverts lors de mes stages chez Airbus,
                                                j'ai entrepris la création de mon propre simulateur de vol sur Unreal
                                                Engine. Ce projet personnel poursuit un double objectif : modéliser
                                                informatiquement les principes de la physique aérodynamique (portance,
                                                traînée, poussée) et maîtriser la programmation orientée objet en C++,
                                                un langage que j'ai appris en autodidacte. En parallèle, je me suis
                                                formé à la modélisation 3D sur Blender afin de concevoir le modèle de
                                                l'avion de A à Z. Vous pouvez consulter mon code source détaillé gérant
                                                la physique de vol sur GitHub, ou visionner une démonstration vidéo du
                                                rendu actuel.
                                            </p>
                                            <a href="https://github.com/AntoineOD/FlightSimUnreal" class="btn">Lien vers

                                            <a href="https://drive.google.com/file/d/13ihOLN9oR2D07l9uG8_nk83m9Moo2gpm/view?usp=sharing"

                                        </div>

                                                Animé par le désir de comprendre le fonctionnement bas niveau du rendu
                                                graphique, j'ai consacré mon temps libre à l'apprentissage de l'API
                                                OpenGL. À travers divers exercices pratiques, j'ai maîtrisé la création
                                                de contextes de rendu, le dessin de primitives géométriques,
                                                l'application de textures, ainsi que la programmation de shaders. J'ai
                                                par la suite approfondi mes connaissances en intégrant une caméra
                                                virtuelle, en important des modèles 3D complexes et en implémentant des
                                                modèles d'éclairage dynamiques. L'ensemble de ma démarche de recherche
                                                et de mes expérimentations est documenté dans le rapport technique
                                                disponible ci-dessous.
                                            </p>
                                            <a href="https://drive.google.com/file/d/1SigM43kqxpRdXbBXh1cVUlCQe9K39bX5/view?usp=sharing"

                                            <p>
                                                Depuis l'été 2025, je m'investis activement au sein de Dronolab, le club
                                                scientifique de drones de l'ÉTS. Cette expérience me donne l'opportunité
                                                de travailler avec une panoplie d'outils de pointe, tels que des
                                                capteurs LiDAR, des nacelles (gimbals), de l'intelligence artificielle
                                                et des contrôleurs de vol. Mes tâches principales consistent à
                                                développer l'interface de contrôle des charges utiles (payloads) et à
                                                concevoir le système de récupération et de traitement des nuages de
                                                points générés par le LiDAR. Grâce à mon implication, j'ai eu la chance
                                                de participer avec l'équipe à la compétition annuelle étudiante de
                                                systèmes d'aéronefs sans pilote (AEAC Annual Student UAS Competition) en
                                                2026.
                                            </p>
                                            <a href="https://www.youtube.com/watch?v=-V9pjc5mUVs" target="_blank"
                                                class="btn">Vidéo de la compétition (Task 2)</a>
